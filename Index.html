<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Belle – Media Delivery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #f7f4f0;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #71b0d1, #a8d4e8);
      color: #fff;
      padding: 28px 32px;
      text-align: center;
    }
    .card-header h1 { font-size: 1.4rem; font-weight: normal; letter-spacing: 0.5px; }
    .card-header p  { font-size: 0.85rem; opacity: 0.85; margin-top: 6px; font-family: sans-serif; }

    .card-body { padding: 32px; }

    .state { display: none; }
    .state.active { display: block; }

    /* Loading */
    .loading-wrap { text-align: center; padding: 24px 0; color: #888; font-family: sans-serif; font-size: 0.9rem; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #d6ecf5;
      border-top-color: #71b0d1; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Form elements */
    .field { margin-bottom: 20px; }
    label  { display: block; font-family: sans-serif; font-size: 0.78rem;
             font-weight: 600; color: #71b0d1; text-transform: uppercase;
             letter-spacing: 0.6px; margin-bottom: 6px; }

    select, input, textarea {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #b8dded; border-radius: 8px;
      font-family: sans-serif; font-size: 0.95rem; color: #333;
      background: #fdfcff; outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input:focus, textarea:focus { border-color: #71b0d1; }
    textarea { min-height: 88px; resize: vertical; }
    select:disabled, input:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; }

    .info-box {
      background: #eaf5fb; border-left: 3px solid #71b0d1;
      border-radius: 6px; padding: 12px 14px;
      font-family: sans-serif; font-size: 0.88rem; color: #555; line-height: 1.5;
    }
    .info-box a { color: #4a9bbf; word-break: break-all; }
    .info-box strong { color: #333; }

    .divider { border: none; border-top: 1px solid #d6ecf5; margin: 24px 0; }

    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #71b0d1, #a8d4e8);
      color: #fff; border: none; border-radius: 8px;
      font-family: sans-serif; font-size: 1rem; font-weight: 600;
      cursor: pointer; letter-spacing: 0.3px;
      transition: opacity 0.2s;
    }
    .btn-submit:hover  { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Error */
    .error-msg { color: #c0392b; font-family: sans-serif; font-size: 0.85rem;
                 margin-top: 8px; display: none; }

    /* Success */
    .success-wrap { text-align: center; padding: 16px 0; }
    .success-icon { font-size: 3rem; margin-bottom: 12px; }
    .success-wrap h2 { color: #71b0d1; font-size: 1.3rem; margin-bottom: 8px; }
    .success-wrap p  { font-family: sans-serif; font-size: 0.9rem; color: #666; line-height: 1.6; }

    /* No projects */
    .empty-msg { text-align: center; font-family: sans-serif; font-size: 0.9rem;
                 color: #888; padding: 12px 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>Blue Belle Weddings</h1>
    <p>Media Delivery Portal</p>
  </div>
  <div class="card-body">

    <!-- Loading state -->
    <div id="state-loading" class="state active">
      <div class="loading-wrap">
        <div class="spinner"></div>
        Loading your projects…
      </div>
    </div>

    <!-- Main form state -->
    <div id="state-form" class="state">

      <div class="field">
        <label for="project-select">Select your project</label>
        <select id="project-select"><option value="">— Choose a project —</option></select>
      </div>

      <div class="field" id="wrap-creative" style="display:none">
        <label for="creative-select">Please select your name</label>
        <select id="creative-select"><option value="">— Select your name —</option></select>
      </div>

      <div id="wrap-project-info" style="display:none">
        <div class="field">
          <label>Upload destination</label>
          <div class="info-box" id="upload-link-box">—</div>
        </div>
        <div class="field" id="wrap-songs" style="display:none">
          <label for="songs-input">Songs choice</label>
          <input type="text" id="songs-input" placeholder="Specify songs selected by the client, or leave blank if you don't know"/>
        </div>
        <hr class="divider"/>
        <div class="field">
          <label for="files-amount">Amount of RAW files <span style="color:#c0392b">*</span></label>
          <input type="number" id="files-amount" min="0" placeholder="e.g. 342"/>
        </div>
        <div class="field">
          <label for="special-notes">Special notes</label>
          <textarea id="special-notes" placeholder="Any special notes about this project…"></textarea>
        </div>
        <div class="field">
          <label for="invoice-amount">Invoice amount ($) <span style="color:#c0392b">*</span></label>
          <input type="number" id="invoice-amount" min="0" step="0.01" placeholder="e.g. 450.00"/>
        </div>
        <div class="field">
          <label for="extras">Extras ($)</label>
          <input type="number" id="extras" min="0" step="0.01" placeholder="e.g. 25.00 – leave blank if none"/>
        </div>
        <div class="field">
          <label for="notes">Extra notes for the management team</label>
          <textarea id="notes" placeholder="Any message for the management team…"></textarea>
        </div>
        <div class="error-msg" id="form-error"></div>
        <button class="btn-submit" id="submit-btn">Submit</button>
      </div>
    </div>

    <!-- Success state -->
    <div id="state-success" class="state">
      <div class="success-wrap">
        <div class="success-icon">🎉</div>
        <h2>Submitted successfully!</h2>
        <p id="success-msg">Your details have been recorded.<br/>Thank you for uploading your media on time!</p>
      </div>
    </div>

    <!-- No projects state -->
    <div id="state-empty" class="state">
      <p class="empty-msg">✅ No projects currently require media upload.<br/>Check back after your next shoot!</p>
    </div>

  </div>
</div>
<script>
  // ── State ──────────────────────────────────────────────────────
  var allProjects = [];   // full project list from server
  var selected    = null; // currently selected project object

  // ── DOM refs ───────────────────────────────────────────────────
  var elProjectSelect  = document.getElementById('project-select');
  var elCreativeSelect = document.getElementById('creative-select');
  var elWrapCreative   = document.getElementById('wrap-creative');
  var elWrapInfo       = document.getElementById('wrap-project-info');
  var elUploadBox      = document.getElementById('upload-link-box');
  var elWrapSongs      = document.getElementById('wrap-songs');
  var elSongsInput     = document.getElementById('songs-input');
  var elFiles          = document.getElementById('files-amount');
  var elSpecialNotes   = document.getElementById('special-notes');
  var elInvoice        = document.getElementById('invoice-amount');
  var elExtras         = document.getElementById('extras');
  var elNotes          = document.getElementById('notes');
  var elSubmitBtn      = document.getElementById('submit-btn');
  var elFormError      = document.getElementById('form-error');
  var elSuccessMsg     = document.getElementById('success-msg');

  // ── Helpers ────────────────────────────────────────────────────
  function showState(id) {
    ['state-loading','state-form','state-success','state-empty'].forEach(function(s) {
      document.getElementById(s).classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
  }

  function showError(msg) {
    elFormError.textContent = msg;
    elFormError.style.display = 'block';
  }

  function clearError() {
    elFormError.textContent = '';
    elFormError.style.display = 'none';
  }

  // ── Page load – fetch projects from server ─────────────────────
  window.onload = function() {
    google.script.run
      .withSuccessHandler(onProjectsLoaded)
      .withFailureHandler(function(err) {
        showState('state-empty');
        console.error(err);
      })
      .getProjects();
  };

  function onProjectsLoaded(projects) {
    allProjects = projects || [];
    if (allProjects.length === 0) { showState('state-empty'); return; }

    allProjects.forEach(function(p, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      elProjectSelect.appendChild(opt);
    });
    showState('state-form');
  }

  // ── Project selection change ───────────────────────────────────
  elProjectSelect.addEventListener('change', function() {
    var idx = this.value;
    clearError();
    elWrapCreative.style.display = 'none';
    elWrapInfo.style.display     = 'none';
    elCreativeSelect.innerHTML   = '<option value="">— Select your name —</option>';
    selected = null;

    if (idx === '') return;

    selected = allProjects[Number(idx)];

    // Populate "Who are you?" dropdown
    var names = [{ label: selected.lead + ' (Lead)', value: 'lead' }];
    if (selected.second) {
      names.push({ label: selected.second + ' (Second)', value: 'second' });
    }
    names.forEach(function(n) {
      var opt = document.createElement('option');
      opt.value = n.value;
      opt.textContent = n.label;
      elCreativeSelect.appendChild(opt);
    });

    elWrapCreative.style.display = 'block';
  });

  // ── Creative selection change ──────────────────────────────────
  elCreativeSelect.addEventListener('change', function() {
    clearError();
    if (!selected || this.value === '') {
      elWrapInfo.style.display = 'none'; return;
    }

    // Upload link
    var link = selected.link;
    elUploadBox.innerHTML = link
      ? 'Please upload your RAW files to this folder:<br/><br/>'
        + '<a href="' + link + '" target="_blank">' + link + '</a>'
      : '<em>No upload link provided — please contact management.</em>';

    // Songs choice (Video only)
    if (selected.type.toLowerCase() === 'video') {
      elSongsInput.value       = selected.songs || '';
      elWrapSongs.style.display = 'block';
    } else {
      elWrapSongs.style.display = 'none';
    }

    // Reset form fields
    elFiles.value        = '';
    elSpecialNotes.value = '';
    elInvoice.value      = '';
    elExtras.value       = '';
    elNotes.value        = '';

    elWrapInfo.style.display = 'block';
  });

  // ── Form submission ────────────────────────────────────────────
  elSubmitBtn.addEventListener('click', function() {
    clearError();

    var role = elCreativeSelect.value;
    if (!selected || !role) { showError('Please select a project and your name.'); return; }

    var filesVal   = elFiles.value.trim();
    var invoiceVal = elInvoice.value.trim();
    if (!filesVal)   { showError('Amount of RAW files is required.'); return; }
    if (!invoiceVal) { showError('Invoice amount is required.'); return; }

    elSubmitBtn.disabled     = true;
    elSubmitBtn.textContent  = 'Submitting…';

    var payload = {
      sheetRow:      selected.sheetRow,
      role:          role,
      filesAmount:   Number(filesVal),
      specialNotes:  elSpecialNotes.value.trim(),
      invoiceAmount: Number(invoiceVal),
      extras:        elExtras.value.trim()  ? Number(elExtras.value.trim())  : 0,
      notes:         elNotes.value.trim(),
      songs:         selected.type.toLowerCase() === 'video' ? elSongsInput.value.trim() : null
    };

    google.script.run
      .withSuccessHandler(function() {
        var creativeName = role === 'lead' ? selected.lead : selected.second;
        elSuccessMsg.innerHTML = 'Hi <strong>' + creativeName.split(' ')[0] + '</strong>, '
          + 'your details for <strong>' + selected.name + '</strong> have been recorded.<br/>'
          + 'Thank you for uploading your media on time!';
        showState('state-success');
      })
      .withFailureHandler(function(err) {
        elSubmitBtn.disabled    = false;
        elSubmitBtn.textContent = 'Submit';
        showError('Submission failed: ' + err.message + '. Please try again.');
      })
      .submitForm(payload);
  });
</script>
</body>
</html>
